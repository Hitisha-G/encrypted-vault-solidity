name: ci

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE"
  pull_request:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE"
  # Weekly run so a new Foundry stable release that breaks fmt or build
  # shows up here instead of on the next unrelated change.
  schedule:
    - cron: "30 3 * * 1"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FOUNDRY_PROFILE: ci

jobs:
  workflow-lint:
    name: lint workflows
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install actionlint
        run: |
          bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.7/scripts/download-actionlint.bash) 1.7.7
          echo "$PWD" >> "$GITHUB_PATH"

      - name: Run actionlint
        run: make lint-ci

  foundry:
    needs: workflow-lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Show forge version
        run: forge --version

      - name: Cache Foundry build
        uses: actions/cache@v4
        with:
          path: |
            cache
            out
          key: foundry-${{ runner.os }}-${{ hashFiles('**/foundry.toml', '**/lib/**', '**/src/**', '**/test/**') }}
          restore-keys: |
            foundry-${{ runner.os }}-

      # Steps call the Makefile targets so `make ci-local` runs exactly
      # what CI runs.
      - name: Check formatting
        run: make fmt-check

      # `shell: bash` turns on pipefail, so tee never hides a forge failure.
      - name: Build
        shell: bash
        run: make sizes | tee sizes.txt

      - name: Test with gas report
        shell: bash
        run: make gas VERBOSITY=-vvv | tee gas-report.txt

      # Surface sizes and gas on the run page so reviewers don't have to
      # dig through raw logs; runs even when tests fail.
      - name: Publish job summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Contract sizes"
            echo '```'
            cat sizes.txt 2>/dev/null || echo "build did not run"
            echo '```'
            echo "## Gas report"
            echo '```'
            cat gas-report.txt 2>/dev/null || echo "tests did not run"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
