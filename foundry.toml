[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.24"
optimizer = true
optimizer_runs = 200
# Keep FFI off unless a script explicitly needs it.
ffi = false

[fmt]
line_length = 100
tab_width = 4
bracket_spacing = true
int_types = "long"
multiline_func_header = "attributes_first"
quote_style = "double"
number_underscore = "thousands"

[profile.ci]
fuzz = { runs = 256 }
invariant = { runs = 64 }
deny = ["warnings"]
